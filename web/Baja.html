<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Baja de Pacientes / Médicos</title>
</head>
<body>
    <h2>Baja Lógica de Pacientes y Médicos</h2>
    <form action="#" method="post">
        <label for="id">ID / Cédula a Modificar Estatus:</label>
        <input type="text" id="id" name="id" required>
        <br><br>
        <label for="estatus">Seleccionar Estatus:</label>
        <select name="estatus" id="estatus">
            <option value="A">Activo (A)</option>
            <option value="I">Inactivo (I)</option>
        </select>
        <br><br>
        <button type="submit">Actualizar Estatus</button>
    </form>
    <br>
    <a href="Menu1.html">Volver al Menú Principal</a>
</body>
</html>
