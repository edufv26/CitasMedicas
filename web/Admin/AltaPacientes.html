<html>
    <head>
        <title>Alta Pacientes</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="form-container">
        <form action="Control" method="post">
            <h2>Registro de Pacientes</h2>

            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="campo">
                <label for="paterno">Apellido paterno:</label>
                <input type="text" id="paterno" name="paterno" required>
            </div>

            <div class="campo">
                <label for="materno">Apellido materno:</label>
                <input type="text" id="materno" name="materno" required>
            </div>

            <div class="campo">
                <label for="tel">Número Telefónico:</label>
                <input type="tel" id="tel" name="tel" required>
            </div>

            <div class="campo">
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div class="campo">
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" required>
            </div>

            <input type="submit" class="btn-enviar" value="Registrar" name="boton">
        </form>
    </div>
    </body>
</html>
